name: Verify guest house
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: guesthouse_test
          POSTGRES_USER: guesthouse_test
          POSTGRES_PASSWORD: integration-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U guesthouse_test -d guesthouse_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/guesthouse_test
      POSTGRES_USER: guesthouse_test
      POSTGRES_PASSWORD: integration-only-password
      JWT_SECRET: integration-only-jwt-secret-with-at-least-32-bytes
      RUN_POSTGRES_TESTS: 'true'
      TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/guesthouse_test
      TEST_DATABASE_USERNAME: guesthouse_test
      TEST_DATABASE_PASSWORD: integration-only-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: ./mvnw -B -ntp verify
      - name: Verify PostgreSQL startup and health
        run: |
          java -jar target/guesthouse-0.0.1-SNAPSHOT.jar > backend.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          if ! curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 2 http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
            cat backend.log
            exit 1
          fi
      - name: Verify seeded facility inventory
        env:
          PGPASSWORD: integration-only-password
        run: |
          count=$(psql -h 127.0.0.1 -U guesthouse_test -d guesthouse_test -tAc 'SELECT count(*) FROM facilities')
          test "$count" -ge 2
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npm test
      - run: npm run build
